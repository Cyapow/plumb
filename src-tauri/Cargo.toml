[package]
name = "plumb"
version = "1.0.1"
description = "Plumb — a free, native Git client for macOS, Windows, and Linux"
authors = ["Mathew Chapman"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plumb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tiny_http = "0.12"
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default features (https/ssh) pull in libssh2-sys + openssl-sys, which fail to
# cross-compile (universal build) and force a Homebrew OpenSSL runtime dep. We
# only use git2 for LOCAL operations — all network ops shell out to system git —
# so we drop them entirely.
git2 = { version = "0.19", default-features = false }
thiserror = "2"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
notify-debouncer-mini = "0.7.0"

# ── Platform-specific ────────────────────────────────────────────────
# Secrets: each OS's native credential store. Fonts: CoreText (macOS only).
# Window chrome (decorum) is macOS + Windows.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
core-text = "20"
core-foundation = "0.10"
tauri-plugin-decorum = "1.1.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-decorum = "1.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

