[package]
name = "plumb"
version = "0.2.0"
description = "Plumb — a free, native macOS Git client"
authors = ["Mathew Chapman"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plumb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default features (https/ssh) pull in libssh2-sys + openssl-sys, which fail to
# cross-compile (universal build) and force a Homebrew OpenSSL runtime dep. We
# only use git2 for LOCAL operations — all network ops shell out to system git —
# so we drop them entirely.
git2 = { version = "0.19", default-features = false }
thiserror = "2"
tauri-plugin-decorum = "1.1.1"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["apple-native"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
notify-debouncer-mini = "0.7.0"
core-text = "20"
core-foundation = "0.10"

