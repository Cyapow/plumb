name: Release

# Build and publish a macOS release when a version tag is pushed. Cut one with
# `npm run release -- <patch|minor|major>`, which bumps the manifests and pushes
# the plumb-vX.Y.Z tag that triggers this workflow. (workflow_dispatch lets you
# re-run a build for the current version manually.)
on:
  push:
    tags:
      - "plumb-v*"
  workflow_dispatch:

# Needed so the workflow can create releases and upload build assets.
permissions:
  contents: write

# Don't run two release builds at once for the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (both macOS arches for a universal build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: plumb-v__VERSION__
          releaseName: Plumb v__VERSION__
          releaseBody: |
            Automated **universal** macOS build (Apple Silicon + Intel) from `${{ github.sha }}`.

            This build is **not notarized by Apple**, so macOS Gatekeeper blocks it on first launch.
            To open it:

            1. Move **Plumb.app** to `/Applications`.
            2. Try to open it once (you'll see "Plumb Not Opened").
            3. Go to **System Settings → Privacy & Security**, scroll down, and click **Open Anyway**.

            Or, from Terminal, clear the quarantine flag:
            ```
            xattr -dr com.apple.quarantine /Applications/Plumb.app
            ```
          releaseDraft: false
          prerelease: false
          # Universal (Apple Silicon + Intel). The inline --config forces ad-hoc
          # signing so CI doesn't try to use the local "Plumb Local Dev" cert,
          # which only exists on the developer's machine.
          args: --target universal-apple-darwin --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
