name: Release

# Build the macOS app on every push to main and publish it to the Releases page.
# The release is keyed to the app version in src-tauri/tauri.conf.json:
#   - pushing without changing the version updates that release's assets
#   - bumping the version cuts a brand-new release
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed so the workflow can create releases and upload build assets.
permissions:
  contents: write

# Don't run two release builds at once for the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (both macOS arches for a universal build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: plumb-v__VERSION__
          releaseName: Plumb v__VERSION__
          releaseBody: |
            Automated macOS build from `${{ github.sha }}`.

            This build is **unsigned** — on first launch, right-click the app and
            choose **Open** (or allow it in System Settings → Privacy & Security).
          releaseDraft: false
          prerelease: false
          # Universal (Apple Silicon + Intel). The inline --config forces ad-hoc
          # signing so CI doesn't try to use the local "Plumb Local Dev" cert,
          # which only exists on the developer's machine.
          args: --target universal-apple-darwin --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
