name: Release

# Build and publish native installers for macOS, Windows, and Linux when a
# version tag is pushed. Cut one with `npm run release -- <patch|minor|major>`.
on:
  push:
    tags:
      - "plumb-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal (Apple Silicon + Intel) build, ad-hoc signed.
          - platform: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: "--target universal-apple-darwin --config '{\"bundle\":{\"macOS\":{\"signingIdentity\":\"-\"}}}'"
          # Linux x86_64 and arm64 (arm64 for Apple Silicon VMs / arm boards).
          - platform: ubuntu-22.04
            targets: ""
            args: "--bundles deb,appimage"
          - platform: ubuntu-22.04-arm
            targets: ""
            args: "--bundles deb,appimage"
          - platform: windows-latest
            targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            xdg-utils

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: plumb-v__VERSION__
          releaseName: Plumb v__VERSION__
          releaseBody: |
            Automated build of Plumb v__VERSION__ for **macOS (universal), Windows, and Linux (x86_64 + arm64)**.

            These builds are **unsigned / not notarized**, so each OS will warn on first run:
            - **macOS:** System Settings → Privacy & Security → *Open Anyway* (or `xattr -dr com.apple.quarantine /Applications/Plumb.app`).
            - **Windows:** SmartScreen → *More info* → *Run anyway*.
            - **Linux:** mark the AppImage executable (`chmod +x`) or install the `.deb`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Build the editor plugins once and attach them to the release, so users can
  # install without a local Node / Gradle / Java toolchain.
  editors:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Package VS Code extension
        run: |
          cd editors/vscode
          npm install
          npm run compile
          npx --yes @vscode/vsce package --out plumb-vscode.vsix

      - name: Upload VS Code extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" editors/vscode/plumb-vscode.vsix --clobber --repo "$GITHUB_REPOSITORY"

      - name: Build JetBrains plugin
        continue-on-error: true
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.9/bin/gradle -p editors/jetbrains buildPlugin --no-daemon --stacktrace

      - name: Upload JetBrains plugin
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip=$(ls editors/jetbrains/build/distributions/*.zip 2>/dev/null | head -1)
          if [ -n "$zip" ]; then
            gh release upload "${{ github.ref_name }}" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "No JetBrains plugin zip produced; skipping."
          fi
